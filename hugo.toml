# =============================================================================
# 站点顶层标量（必须全部写在第一个 [table] 之前；表之后的裸键会静默并入该表）
# =============================================================================
baseURL                = 'https://hencte.top/'
title                  = '亦幸小阁'
defaultContentLanguage = 'zh'
theme                  = "kiss"
enableEmoji            = true
enableGitInfo          = true
enableRobotsTXT        = true
hasCJKLanguage         = true
summaryLength          = 200
# 线上站点无 tag/category 路由；保留默认 taxonomy 会产出一批不在 URL 集合里的薄页。
disableKinds = ['taxonomy', 'term']

# -----------------------------------------------------------------------------
# 输出压缩
# Hugo ≥ 0.150 移除了顶层 minify 键（会报 deprecated）；改用下方表项。
# 写在配置而非构建命令里：Cloudflare Workers Builds 面板只跑裸 hugo，仓库改不了。
# 实测：HTML 21.2 MB → 16.2 MB，构建耗时不变。
# -----------------------------------------------------------------------------
[minify]
  minifyOutput = true

# -----------------------------------------------------------------------------
# Markdown / 目录
# -----------------------------------------------------------------------------
[markup]
  [markup.goldmark]
    # 旧 Astro 站允许 Markdown 内嵌原始 HTML（<mark>、<div> 等）；
    # 不开 unsafe 会被剥掉并换成注释，渲染结果会不一致。
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3

# -----------------------------------------------------------------------------
# 站点参数（模板 / SEO / 社交）
# -----------------------------------------------------------------------------
[params]
  # 小说正文在浏览器用 <canvas> 绘制（非构建期出图）。
  novelCanvas = true

  applicationName      = '亦幸小阁'
  author               = 'Hencter Lew'
  bingSiteVerification = 'DE3B203227A8CF344D0A0F8E02B192CB'
  defaultImage         = '/og-image.png'
  description          = '亦幸（Hencter Lew）的公开项目与博客：产品实践、知识管理与技术写作；Hugo 构建，简 / 繁（台 · 港）/ 英四语。'
  # 作者 X 账号是 @hencte（GitHub twitter_username=hencte，主页 README 链 x.com/hencte）。
  # 旧值 @hencter 会让 twitter:site 指向别人的账号。
  twitterSite          = '@hencte'

# -----------------------------------------------------------------------------
# front matter 日期
# 迁移曾重写全部内容文件，若用 git 提交日会整站显示「更新于 2026-10-03」。
# 优先显式 lastmod，其次文章自身 date。
# https://gohugo.io/getting-started/configuration/#frontmatter
# -----------------------------------------------------------------------------
[frontmatter]
  lastmod = ['lastmod', 'date']

# -----------------------------------------------------------------------------
# 自定义输出格式
# 线上订阅源路径是 /rss.xml，不是 Hugo 默认的 /index.xml。
# -----------------------------------------------------------------------------
[outputFormats.RSS]
  baseName  = 'rss'
  mediaType = 'application/rss+xml'

# 面向代理的机器可读索引（Cite/Protect 策略与 layouts/robots.txt 一致）。
# 模板：layouts/home.<format>.txt
[outputFormats.llms]
  baseName       = 'llms'
  isPlainText    = true
  mediaType      = 'text/plain'
  notAlternative = true
[outputFormats.llm]
  baseName       = 'llm'
  isPlainText    = true
  mediaType      = 'text/plain'
  notAlternative = true
[outputFormats.llmsfull]
  baseName       = 'llms-full'
  isPlainText    = true
  mediaType      = 'text/plain'
  notAlternative = true

[outputs]
  home = ['HTML', 'RSS', 'llms', 'llm', 'llmsfull']

# -----------------------------------------------------------------------------
# 多语言
# 默认语种用 content 根目录；其余语种各自子路径（/en/…、/tw/…、/hk/…）。
# -----------------------------------------------------------------------------
[languages]
  [languages.zh]
    contentDir = 'content'
    label      = '简体'
    locale     = 'zh-CN'
    weight     = 0
    # 导航对齐旧 Astro getNavLinks()：Logo 即首页，不再单独放「首页」项。
    [[languages.zh.menus.main]]
      name    = '项目'
      pageRef = '/projects'
      weight  = 10
    [[languages.zh.menus.main]]
      name    = '博客'
      pageRef = '/blog'
      weight  = 20
    [[languages.zh.menus.main]]
      name    = '友链'
      pageRef = '/links'
      weight  = 30
    [[languages.zh.menus.main]]
      name    = '关于'
      pageRef = '/about'
      weight  = 40
    [[languages.zh.menus.main]]
      name   = '联系'
      # 裸 `#contact` 在 536 页里有 524 页无效：只有 home/about/links 带该 id。
      # 菜单 URL 按字面输出（见 _partials/menu.html），故按语种写全路径。
      url    = '/about/#contact'
      weight = 50

  [languages.en]
    contentDir = 'content'
    label      = 'EN'
    locale     = 'en-US'
    weight     = 1
    [[languages.en.menus.main]]
      name    = 'Projects'
      pageRef = '/projects'
      weight  = 10
    [[languages.en.menus.main]]
      name    = 'Blog'
      pageRef = '/blog'
      weight  = 20
    [[languages.en.menus.main]]
      name    = 'Friends'
      pageRef = '/links'
      weight  = 30
    [[languages.en.menus.main]]
      name    = 'About'
      pageRef = '/about'
      weight  = 40
    [[languages.en.menus.main]]
      name   = 'Contact'
      url    = '/en/about/#contact'
      weight = 50

  # 繁体镜像由 scripts/build_variants.mjs（`pnpm variants`）从默认 content 根生成：
  # 品牌页与 shelf，对齐旧 Astro src/pages/{tw,hk}/；标签文案同源 getNavLinks()。
  [languages.tw]
    contentDir = 'content'
    # 不设语种 title 时，页头 Logo 与 <title> 后缀会残留简体
    # （「關於 | 亦幸小閣 | 亦幸小阁」）。
    title      = '亦幸小閣'
    label      = '繁體（台灣）'
    locale     = 'zh-TW'
    weight     = 2
    [[languages.tw.menus.main]]
      name    = '項目'
      pageRef = '/projects'
      weight  = 10
    [[languages.tw.menus.main]]
      name    = '博客'
      pageRef = '/blog'
      weight  = 20
    [[languages.tw.menus.main]]
      name    = '友鏈'
      pageRef = '/links'
      weight  = 30
    [[languages.tw.menus.main]]
      name    = '關於'
      pageRef = '/about'
      weight  = 40
    [[languages.tw.menus.main]]
      name   = '聯繫'
      url    = '/tw/about/#contact'
      weight = 50

  [languages.hk]
    contentDir = 'content'
    title      = '亦幸小閣'
    label      = '繁體（香港）'
    locale     = 'zh-HK'
    weight     = 3
    [[languages.hk.menus.main]]
      name    = '項目'
      pageRef = '/projects'
      weight  = 10
    [[languages.hk.menus.main]]
      name    = '博客'
      pageRef = '/blog'
      weight  = 20
    [[languages.hk.menus.main]]
      name    = '友鏈'
      pageRef = '/links'
      weight  = 30
    [[languages.hk.menus.main]]
      name    = '關於'
      pageRef = '/about'
      weight  = 40
    [[languages.hk.menus.main]]
      name   = '聯絡'
      url    = '/hk/about/#contact'
      weight = 50

# -----------------------------------------------------------------------------
# 构建统计
# hugo_stats.json（仓库根）供 Tailwind CLI 扫描类名清单。
# Tailwind 由 `pnpm css` 在 Hugo 之前编译，不用 Hugo 的 css.TailwindCSS transform
# （见 themes/kiss/assets/css/main.css 与 package.json）。
# -----------------------------------------------------------------------------
[build]
  [build.buildStats]
    enable = true
