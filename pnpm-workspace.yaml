# pnpm 10 (used by Cloudflare Pages) requires an explicit `packages` field; without
# it `pnpm install --frozen-lockfile` fails with "packages field missing or empty".
# The site itself needs no dependencies at build time (`hugo` alone builds it) —
# these packages only back the occasional `pnpm generate` steps.
packages:
  - '.'
# pnpm blocks dependency install scripts by default and records the decision in
# `allowBuilds`. Leaving a dependency undecided makes `pnpm install` — and so
# every `pnpm run`, which verifies deps first — exit non-zero.
# @tailwindcss/oxide ships Tailwind CSS v4's native engine; @parcel/watcher backs
# Tailwind's --watch mode. esbuild + workerd come from wrangler (deploy command
# runs `pnpm run deploy` from node_modules instead of `npx wrangler`, which used
# to re-download wrangler on every build); both postinstalls only locate the
# platform binary already shipped via optionalDependencies.
allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  esbuild: true
  workerd: true
