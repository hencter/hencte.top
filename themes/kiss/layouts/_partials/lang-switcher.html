{{/*
  Language switcher: a native <select> whose option values are the target URLs.

  Uses hugo.Sites (the documented replacement for the Site.Sites/Page.Sites pair
  deprecated in v0.156.0). A language the page has no translation in falls back to
  that language's home — same computation as head/lang-auto.html, so manual and
  automatic switching always agree.

  The <option> carries `data-locale` (BCP 47) both for the reader's information and
  so the tooling can check the targets; the change handler lives in assets/js/site.js,
  which also records the explicit choice that disables auto-detection.

  @context {page} page
*/}}
{{- $page := . -}}
{{- $sites := hugo.Sites -}}
{{- if gt (len $sites) 1 -}}
  <label class="lang-switch inline-flex items-center">
    <span class="sr-only">{{ T "language" }}</span>
    <select
     class="lang-select rounded-md border border-line bg-transparent px-2 py-1 text-sm text-ink-soft transition-colors hover:text-accent"
      aria-label="{{ T "language" }}"
    >
      {{- range $sites }}
        {{- $siteLang := .Language.Lang }}
        {{- $target := .Home }}
        {{- range $page.AllTranslations }}{{ if eq .Language.Lang $siteLang }}{{ $target = . }}{{ end }}{{ end }}
        <option
          value="{{ $target.RelPermalink }}"
          data-locale="{{ .Language.Locale }}"
          lang="{{ .Language.Locale }}"
          {{ if eq $page.Language.Lang $siteLang }}selected{{ end }}
        >{{ .Language.Label }}</option>
      {{- end }}
    </select>
  </label>
{{- end -}}
