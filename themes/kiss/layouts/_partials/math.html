{{/* Config MUST be defined before the MathJax bundle loads: with the script first,
   a cached bundle could start before `MathJax = {...}` was set and silently ignore
   the delimiters. Version pinned (was `mathjax@3`, a floating major) so an upstream
   release cannot change rendering under us. */}}
<script>
  MathJax = {
    tex: {
      displayMath: [['\\[', '\\]'], ['$$', '$$']],  // block
      inlineMath: [['\\(', '\\)']]                  // inline
    },
    loader:{
      load: ['ui/safe']
    },
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
